name: Bible First Post

on:
  workflow_dispatch:
    inputs:
      render_video:
        description: "Render episode 1 with MoneyPrinterTurbo"
        required: true
        default: false
        type: boolean

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate 66-book Bible rules
        run: |
          python scripts/bible_content_engine.py --episode 1

      - name: Build first episode script
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          src = Path("content/bible/episodes/001_creation.json")
          out = Path("storage/bible/episode_001_script.txt")
          data = json.loads(src.read_text(encoding="utf-8"))
          s = data["script"]

          lines = [
              s["hook"],
              s["intro"],
              *s["body"],
              s["cta"],
              s["end_card"],
          ]
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text("\n\n".join(lines) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Set up native MoneyPrinterTurbo config
        if: ${{ inputs.render_video }}
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${PIXABAY_API_KEY:-}" ]; then
            echo "PIXABAY_API_KEY is not configured."
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          template = Path("config.example.toml").read_text(encoding="utf-8")

          replacements = {
              'video_source = "pexels"': 'video_source = "pixabay"',
              'pixabay_api_keys = []': f'pixabay_api_keys = [{json.dumps(os.environ["PIXABAY_API_KEY"])}]',
          }

          for old, new in replacements.items():
              if old not in template:
                  raise RuntimeError(f"Expected MPT config entry not found: {old}")
              template = template.replace(old, new, 1)

          Path("config.toml").write_text(template, encoding="utf-8")
          print("Created native MoneyPrinterTurbo config.toml from config.example.toml.")
          print("Video source: pixabay")
          print("LLM provider: not required for this prepared-script test")
          print("API key values were supplied from GitHub Secrets and were not printed.")
          PY

      - name: Render first video
        if: ${{ inputs.render_video }}
        run: |
          set -euo pipefail

          uv sync --frozen
          uv run python cli.py \
            --video-subject "Creation: In the Beginning" \
            --video-script "$(cat storage/bible/episode_001_script.txt)" \
            --video-language en-US \
            --video-aspect 9:16 \
            --video-source pixabay \
            --video-terms "creation,earth,sky,water,land,plants,sun,moon,stars,birds,animals,humanity" \
            --stop-at video

      - name: Upload first episode artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kindled-iron-bible-episode-001
          path: |
            storage/bible/episode_001.json
            storage/bible/episode_001_script.txt
            storage/tasks/**
          if-no-files-found: warn
