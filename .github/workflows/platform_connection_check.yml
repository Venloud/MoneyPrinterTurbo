name: Platform Connection Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Validate all platform credentials
        env:
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_OPEN_ID: ${{ secrets.TIKTOK_OPEN_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          failures = []

          def require(*names):
              missing = [name for name in names if not os.environ.get(name)]
              if missing:
                  failures.append(f"{', '.join(missing)} missing")
                  return False
              return True

          def request(name, url, method="GET", data=None, headers=None):
              try:
                  req = urllib.request.Request(
                      url,
                      data=data,
                      headers=headers or {},
                      method=method,
                  )
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read().decode("utf-8", errors="replace")
                      return json.loads(body) if body else {}
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  try:
                      detail = json.loads(body)
                  except Exception:
                      detail = body[:500]
                  failures.append(f"{name}: HTTP {exc.code}: {detail}")
              except Exception as exc:
                  failures.append(f"{name}: {exc}")
              return None

          print("Checking TikTok...")
          if require("TIKTOK_ACCESS_TOKEN", "TIKTOK_OPEN_ID"):
              data = request(
                  "TikTok",
                  "https://open.tiktokapis.com/v2/post/publish/creator_info/query/",
                  method="POST",
                  data=b"{}",
                  headers={
                      "Authorization": f"Bearer {os.environ['TIKTOK_ACCESS_TOKEN']}",
                      "Content-Type": "application/json",
                  },
              )
              if data and data.get("error", {}).get("code") not in (None, "ok"):
                  failures.append(f"TikTok: {data.get('error')}")
              elif data is not None:
                  print(f"  OK: @{data.get('data', {}).get('creator_username', 'unknown')}")

          print("Checking YouTube...")
          if require("YOUTUBE_CLIENT_ID", "YOUTUBE_CLIENT_SECRET", "YOUTUBE_REFRESH_TOKEN"):
              token_body = urllib.parse.urlencode({
                  "client_id": os.environ["YOUTUBE_CLIENT_ID"],
                  "client_secret": os.environ["YOUTUBE_CLIENT_SECRET"],
                  "refresh_token": os.environ["YOUTUBE_REFRESH_TOKEN"],
                  "grant_type": "refresh_token",
              }).encode()
              token_data = request(
                  "YouTube OAuth",
                  "https://oauth2.googleapis.com/token",
                  method="POST",
                  data=token_body,
                  headers={"Content-Type": "application/x-www-form-urlencoded"},
              )
              if token_data and token_data.get("access_token"):
                  granted_scopes = set((token_data.get("scope") or "").split())
                  required_scope = "https://www.googleapis.com/auth/youtube.upload"
                  if required_scope in granted_scopes:
                      print("  OK: youtube.upload scope granted")
                  else:
                      failures.append(
                          "YouTube: refresh token does not grant youtube.upload scope"
                      )

          print("Checking Instagram...")
          if require("INSTAGRAM_ACCESS_TOKEN"):
              data = request(
                  "Instagram",
                  "https://graph.instagram.com/v23.0/me?fields=id,username",
                  headers={"Authorization": f"Bearer {os.environ['INSTAGRAM_ACCESS_TOKEN']}"},
              )
              if data:
                  print(f"  OK: @{data.get('username', 'unknown')}")

          print("Checking Threads...")
          if require("THREADS_ACCESS_TOKEN"):
              data = request(
                  "Threads",
                  "https://graph.threads.net/v1.0/me?fields=id,username",
                  headers={"Authorization": f"Bearer {os.environ['THREADS_ACCESS_TOKEN']}"},
              )
              if data:
                  print(f"  OK: @{data.get('username', 'unknown')}")

          print("Checking Facebook Page...")
          if require("FACEBOOK_PAGE_ACCESS_TOKEN", "FACEBOOK_PAGE_ID"):
              page_id = urllib.parse.quote(os.environ["FACEBOOK_PAGE_ID"], safe="")
              data = request(
                  "Facebook Page",
                  f"https://graph.facebook.com/v23.0/{page_id}?fields=id,name",
                  headers={"Authorization": f"Bearer {os.environ['FACEBOOK_PAGE_ACCESS_TOKEN']}"},
              )
              if data:
                  print(f"  OK: {data.get('name', 'unknown')} ({data.get('id', 'unknown')})")

          if failures:
              print("\nCONNECTION CHECK FAILED")
              for failure in failures:
                  print(f"  - {failure}")
              sys.exit(1)

          print("\nALL PLATFORM CONNECTIONS PASSED")
          PY
