name: Kindled Iron V3 Private Review
on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Stills first; video only after preview delivery'
        type: choice
        options: [preview, video]
        default: preview
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free render dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
          pip install numpy soundfile faster-whisper playwright pillow
          python -m playwright install chromium --with-deps
      - name: Private inputs only
        env:
          GH_TOKEN: ${{ secrets.VOICE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh repo view Venloud/kindled-iron-voice --json isPrivate -q .isPrivate)" = true
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" clone --depth 1 --filter=blob:none --sparse https://github.com/Venloud/kindled-iron-voice.git "$RUNNER_TEMP/private"
          git -C "$RUNNER_TEMP/private" sparse-checkout set movie_reference music approved_audio/love-of-money-v3 previews/love-of-money-v3
          echo "KI_PRIVATE_MEDIA=$RUNNER_TEMP/private" >> "$GITHUB_ENV"
          echo "KI_CLIP_CACHE=$RUNNER_TEMP/clips" >> "$GITHUB_ENV"
      - name: Align, fetch pinned footage, audit every frame, render requested phase
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ELEVENLABS_API_KEY: ''
          KI_THIRD_PARTY: '1'
          PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          python -m kindled_iron.render kindled_iron/scenes/love-of-money-v3.json --audio "$KI_PRIVATE_MEDIA/approved_audio/love-of-money-v3/goodone.mp3" --work "$RUNNER_TEMP/v3" --review-phase "$PHASE"
      - name: Save review only in private previews folder
        env:
          GH_TOKEN: ${{ secrets.VOICE_REPO_TOKEN }}
          PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          d="$KI_PRIVATE_MEDIA/previews/love-of-money-v3"
          mkdir -p "$d"
          cp "$RUNNER_TEMP/v3/metadata.json" "$RUNNER_TEMP/v3/shot-list.md" "$d/"
          if [ "$PHASE" = preview ]; then cp "$RUNNER_TEMP/v3/eight-frames.jpg" "$d/"; fi
          if [ "$PHASE" = video ]; then cp "$RUNNER_TEMP/v3/love-of-money-v3.mp4" "$d/"; fi
          git -C "$KI_PRIVATE_MEDIA" add movie_reference/index.json
          git -C "$KI_PRIVATE_MEDIA" add --sparse -f previews/love-of-money-v3
          git -C "$KI_PRIVATE_MEDIA" -c user.name=kindled-review -c user.email=kindled-review@users.noreply.github.com commit -m "Love of Money V3 private $PHASE review ($GITHUB_SHA)"
          git -C "$KI_PRIVATE_MEDIA" -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" pull --rebase origin main
          git -C "$KI_PRIVATE_MEDIA" -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:main
