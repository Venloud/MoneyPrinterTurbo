name: Bible First Post

on:
  workflow_dispatch:
    inputs:
      render_video:
        description: "Render upgraded Genesis 1 episode"
        required: true
        default: false
        type: boolean

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        if: ${{ inputs.render_video }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Validate 66-book Bible rules
        run: |
          python scripts/bible_content_engine.py --episode 1

      - name: Build scene based Bible story
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("content/bible/episodes/001_creation_scenes.json").read_text(encoding="utf-8"))
          lines = [s["narration"] for s in data["scenes"]] + [data["cta"]]
          out = Path("storage/bible/episode_001_script.txt")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text("\n\n".join(lines) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Set up native MoneyPrinterTurbo config
        if: ${{ inputs.render_video }}
        run: |
          set -euo pipefail
          cp config.example.toml config.toml
          echo "Created native MoneyPrinterTurbo config.toml."

      - name: Configure native Pixabay stock footage flow
        if: ${{ inputs.render_video }}
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PIXABAY_API_KEY:-}" ]; then
            echo "PIXABAY_API_KEY is required."
            exit 1
          fi
          cp config.example.toml config.toml
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path("config.toml")
          s = p.read_text(encoding="utf-8")
          s = s.replace('video_source = "pexels"', 'video_source = "pixabay"')
          s = s.replace("pixabay_api_keys = []", 'pixabay_api_keys = ["' + os.environ["PIXABAY_API_KEY"] + '"]')
          p.write_text(s, encoding="utf-8")
          PY
          echo "Configured MoneyPrinterTurbo to use Pixabay stock footage."

      - name: Render base video with native MoneyPrinterTurbo
        if: ${{ inputs.render_video }}
        run: |
          set -euo pipefail
          uv sync --frozen
          uv sync --frozen
          uv run python cli.py \
            --video-subject "Creation: In the Beginning" \
            --video-script "$(cat storage/bible/episode_001_script.txt)" \
            --video-language en-US \
            --video-aspect 9:16 \
            --video-source pixabay \
            --video-terms "creation, earth, ocean, sky, stars, nature, animals, sunrise" \
            --video-clip-duration 8 \
            --video-fit-mode cover \
            --video-transition-mode fade-in \
            --bgm-type none \
            --subtitle-enabled=true \
            --stop-at video

      - name: Add Kindled Iron cinematic polish
        if: ${{ inputs.render_video }}
        run: |
          set -euo pipefail
          BASE="$(find storage/tasks -type f -name '*.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          if [ -z "$BASE" ] || [ ! -f "$BASE" ]; then
            echo "MoneyPrinterTurbo did not produce an MP4."
            exit 1
          fi
          ffmpeg -y -i "$BASE" -i storage/bible/episode_001/narration.mp3 \
            -vf "colorbalance=rs=0.02:gs=0.008:bs=-0.012:rm=0.018:gm=0.004:bm=-0.01:rh=0.025:gh=0.006:bh=-0.015,eq=contrast=1.035:saturation=1.03,drawbox=x=0:y=0:w=iw:h=116:color=black@0.30:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='KINDLED IRON':fontcolor=white@0.92:fontsize=40:x=(w-text_w)/2:y=30,subtitles=storage/bible/episode_001/captions.ass,subtitles=storage/bible/episode_001/references.srt:force_style='FontName=DejaVu Sans,FontSize=15,Bold=1,PrimaryColour=&H000080FF,OutlineColour=&HCC000000,Outline=2,Shadow=1,Alignment=8,MarginV=142'" \
            -map 0:v:0 -map 1:a:0 -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -c:a aac -b:a 192k -shortest \
            storage/bible/kindled-iron-episode-001.mp4

      - name: Upload first episode artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kindled-iron-bible-episode-001
          path: |
            storage/bible/episode_001.json
            storage/bible/episode_001_script.txt
            storage/bible/episode_001/**
            storage/bible/kindled-iron-episode-001.mp4
            storage/tasks/**
          if-no-files-found: warn
