name: "Kindled Iron 3 - Publish Everywhere"

# Workflow 3 of 3 (see kindled_iron/RELEASE.md). The ONLY Kindled Iron workflow that posts. Manual only: no
# schedule. Posts ONE video the owner approved with "Kindled Iron 2 - Approve and Add to Buffer"
# (kindled-iron-voice/buffer/<id>.json) to the platforms that approval names and that are not 'off' in
# kindled_iron/publish_config.json. Refused when the buffer is empty, the video is not in it, its MP4 is no longer
# the approved sha256, or every platform already has it. A platform whose connection check fails (missing or
# expired credentials) is skipped; one platform failing never stops the others; every post is written to the
# private ledger approved/posted.json at once, so a re-run posts only the platforms still missing (never twice).
# check_only = refresh tokens and check every platform's connection, post nothing.
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "Exact approved video id from the buffer (buffer/<id>.json)"
        required: false
        default: ""
      only:
        description: "Only these platforms (comma list, within the approved ones); empty = every approved platform"
        required: false
        default: ""
      check_only:
        description: "Check every platform's connection, post nothing"
        type: boolean
        default: false

permissions:
  contents: write              # only for the short-lived public copy of the video (deleted at the end)

concurrency:
  group: kindled-iron-release  # shared with approvals: the buffer and the ledger never change twice at once
  cancel-in-progress: false

env:
  VOICE_REPO: ${{ vars.KI_VOICE_REPO || 'Venloud/kindled-iron-voice' }}
  TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
  TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
  TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
  TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
  TIKTOK_OPEN_ID: ${{ secrets.TIKTOK_OPEN_ID }}
  YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
  YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
  YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
  INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
  THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
  FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
  FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
  GH_SECRETS_WRITE_TOKEN: ${{ secrets.GH_SECRETS_WRITE_TOKEN }}
  TOKEN_MIRROR_REPOS: ${{ vars.TOKEN_MIRROR_REPOS }}
  META_APP_ID: ${{ secrets.META_APP_ID }}
  META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Connection check only (refreshes tokens, posts nothing)
        if: ${{ inputs.check_only }}
        run: python -m kindled_iron.publish --check-only --only "${{ inputs.only }}"

      - name: Select the approved video from the private buffer
        id: fetch
        if: ${{ !inputs.check_only }}
        env:
          GH_TOKEN: ${{ secrets.VOICE_REPO_TOKEN }}
          VID: ${{ inputs.video_id }}
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          [ -n "$VID" ] || { echo "::error::give video_id: an approved video from the buffer (nothing is published without one)"; exit 1; }
          [ -n "$GH_TOKEN" ] || { echo "::error::VOICE_REPO_TOKEN missing (repository secret)"; exit 1; }
          d="$RUNNER_TEMP/ki-private"
          git clone -q --depth 1 --filter=blob:none --sparse "https://x-access-token:${GH_TOKEN}@github.com/${VOICE_REPO}.git" "$d"
          git -C "$d" sparse-checkout set buffer approved "previews/$VID"
          [ "$(gh repo view "$VOICE_REPO" --json isPrivate -q .isPrivate)" = "true" ] || { echo "::error::$VOICE_REPO is not private"; exit 1; }
          [ -f "$d/approved/posted.json" ] || echo "{}" > "$d/approved/posted.json"
          python -m json.tool "$d/approved/posted.json" > /dev/null || { echo "::error::approved/posted.json is not valid JSON: no posting without the ledger"; exit 1; }
          python -m kindled_iron.release select --private "$d" --id "$VID" --ledger "$d/approved/posted.json" \
            --platforms "$ONLY" --out selected.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          s = json.load(open("selected.json"))
          print(f"video={s['video_path']}\nmeta={s['meta_path']}\npost={s['post_path']}\nname={s['render_name']}")
          print(f"platforms={','.join(s['remaining'])}")
          PY
          echo "PRIVATE=$d" >> "$GITHUB_ENV"
          echo "tag=ki-tmp-${{ github.run_id }}" >> "$GITHUB_OUTPUT"

      - name: Short-lived public copy (Threads / Instagram fetch the video from a URL), deleted at the end
        id: tmp
        if: ${{ steps.fetch.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.fetch.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "temporary (deleted after publishing)" --notes "Temporary copy for platform upload; removed automatically." \
            "${{ steps.fetch.outputs.video }}#video.mp4"
          name=$(basename "${{ steps.fetch.outputs.video }}")
          echo "url=https://github.com/$GITHUB_REPOSITORY/releases/download/${{ steps.fetch.outputs.tag }}/$name" >> "$GITHUB_OUTPUT"

      - name: Publish (only the platforms that do not have it yet)
        if: ${{ steps.fetch.outcome == 'success' }}
        run: |
          python -m kindled_iron.publish --video "${{ steps.fetch.outputs.video }}" --meta "${{ steps.fetch.outputs.meta }}" \
            --post "${{ steps.fetch.outputs.post }}" --public-url "${{ steps.tmp.outputs.url }}" \
            --only "${{ steps.fetch.outputs.platforms }}" --ledger "$PRIVATE/approved/posted.json" \
            --render-name "${{ steps.fetch.outputs.name }}"

      - name: Save the post ledger and the buffer state to the private repo
        id: save
        if: ${{ always() && steps.fetch.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.VOICE_REPO_TOKEN }}
          VID: ${{ inputs.video_id }}
        run: |
          set -uo pipefail
          d="$PRIVATE"
          python -m kindled_iron.release finish --private "$d" --id "$VID" --ledger "$d/approved/posted.json" \
            --results publish_results.json --out finish.json; rc=$?
          git -C "$d" add approved/posted.json "buffer/$VID.json"
          git -C "$d" config user.name "kindled-iron-publish"; git -C "$d" config user.email "kindled-iron-publish@users.noreply.github.com"
          if git -C "$d" commit -q -m "Post ledger: $VID (run ${{ github.run_id }})"; then
            for i in 1 2 3; do git -C "$d" push -q origin HEAD:main && break; sleep 5; git -C "$d" pull -q --rebase origin main; done
            git -C "$d" fetch -q origin main
            git -C "$d" diff --quiet origin/main HEAD -- approved/posted.json \
              || { echo "::error::the post ledger was NOT saved: copy posted.json from the run artifact into approved/posted.json before publishing again"; exit 1; }
          fi
          cp "$d/approved/posted.json" posted.json
          python - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          f = json.load(open("finish.json"))
          print(f"### {f['id']}: {f['state']}\n| platform | result | url |\n|---|---|---|")
          for p, v in f["platforms"].items():
              print(f"| {p} | {'OK ' + str(v.get('mode') or '') if v['ok'] else 'FAILED ' + str(v.get('error') or '')[:160]} | {v.get('url') or '-'} |")
          PY
          exit $rc

      - name: Remove the public copy
        if: ${{ always() && steps.fetch.outputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ steps.fetch.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

      - name: Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-results
          path: |
            publish_results.json
            posted.json
            finish.json
          if-no-files-found: ignore

      - name: Delete the private checkout
        if: always()
        run: rm -rf "$RUNNER_TEMP/ki-private"
