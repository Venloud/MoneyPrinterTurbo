name: Kindled Iron CoAnimator Test

on:
  workflow_dispatch:

jobs:
  coanimator-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg and display server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg xvfb

      - name: Check CoAnimator project
        run: |
          set -euo pipefail
          test -f content/bible/coanimator/project/project.json
          echo "CoAnimator project found."

      - name: Check CoAnimator CLI
        run: |
          set -euo pipefail
          if ! command -v coa >/dev/null 2>&1; then
            echo "CoAnimator CLI is not installed on this GitHub runner."
            echo "Use a self hosted runner with CoAnimator installed, then rerun."
            exit 1
          fi
          coa --help

      - name: Render CoAnimator test
        run: |
          set -euo pipefail
          mkdir -p storage/bible/coanimator
          xvfb-run -a python scripts/coanimator_render.py             --project content/bible/coanimator/project             --output storage/bible/coanimator/episode_001.mp4             --resolution 720p             --fps 30             --quality standard

      - name: Validate MP4
        run: |
          set -euo pipefail
          ffprobe -v error             -show_entries format=duration,size             -of default=noprint_wrappers=1             storage/bible/coanimator/episode_001.mp4

      - name: Upload CoAnimator test
        uses: actions/upload-artifact@v4
        with:
          name: kindled-iron-coanimator-test
          path: storage/bible/coanimator/episode_001.mp4
          if-no-files-found: error
          retention-days: 14
