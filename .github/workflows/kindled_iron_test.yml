name: Kindled Iron Test Render

# Test only: renders one scene JSON. Never publishes to TikTok/YouTube or anywhere public.
# Default voice is Kokoro. Tick my_voice for the owner's ElevenLabs voice (fallback: Chatterbox -> Kokoro).
# With my_voice, the videos go to the owner's PRIVATE voice repo (release "test-renders"), not to the
# public artifacts of this fork.
on:
  workflow_dispatch:
    inputs:
      scene:
        description: "Scene JSON to render"
        required: true
        default: "kindled_iron/scenes/where-did-god-come-from.json"
      my_voice:
        description: "Use my cloned voice (ElevenLabs)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  VOICE_REPO: ${{ vars.KI_VOICE_REPO || 'Venloud/kindled-iron-voice' }}
  HAS_VOICE_REPO: ${{ secrets.VOICE_REPO_TOKEN != '' }}
  KI_TTS_CACHE: ${{ github.workspace }}/.ki-cache/tts
  KI_CLIP_CACHE: ${{ github.workspace }}/.ki-cache/clips

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages (ffmpeg, espeak-ng, Chrome)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg espeak-ng fonts-dejavu-core
          if ! command -v google-chrome >/dev/null; then
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get install -y /tmp/chrome.deb
          fi
          google-chrome --version
          echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"

      - name: Cache models (Kokoro, Whisper, Chatterbox)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kindled-iron-models-v2

      - name: Restore voice audio + clips cache (re-renders cost 0 ElevenLabs credits)
        uses: actions/cache/restore@v4
        with:
          path: .ki-cache
          key: ki-media-${{ github.run_id }}
          restore-keys: ki-media-

      - name: Install Python packages
        run: |
          set -euo pipefail
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install kokoro soundfile faster-whisper playwright
          python -m spacy download en_core_web_sm

      - name: Chatterbox fallback (my_voice only; separate venv + private reference clip)
        if: ${{ inputs.my_voice && env.HAS_VOICE_REPO == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.VOICE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view voice-refs --repo "$VOICE_REPO" >/dev/null 2>&1; then
            echo "::notice::No reference clips yet (run Kindled Iron Voice Bootstrap once). Chatterbox fallback skipped."
            exit 0
          fi
          python -m venv "$RUNNER_TEMP/cbx"
          "$RUNNER_TEMP/cbx/bin/pip" install -q chatterbox-tts --extra-index-url https://download.pytorch.org/whl/cpu
          clip=$(python -c "import json;print(json.load(open('kindled_iron/voice_profiles.json'))['kindled_iron']['chatterbox']['reference_clip'])")
          mkdir -p "$RUNNER_TEMP/voice_refs"
          gh release download voice-refs --repo "$VOICE_REPO" --pattern "$clip" --dir "$RUNNER_TEMP/voice_refs"
          echo "KI_CHATTERBOX_PYTHON=$RUNNER_TEMP/cbx/bin/python" >> "$GITHUB_ENV"
          echo "KI_VOICE_REF_DIR=$RUNNER_TEMP/voice_refs" >> "$GITHUB_ENV"

      - name: Render (+ safe-box debug copy and stills)
        env:
          ELEVENLABS_API_KEY: ${{ inputs.my_voice && secrets.ELEVENLABS_API_KEY || '' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TTS: ${{ inputs.my_voice && 'elevenlabs' || 'kokoro' }}
        run: |
          set -euo pipefail
          python -m kindled_iron.render "${{ inputs.scene }}" --out storage/kindled_iron/test.mp4 \
            --work storage/kindled_iron/work --tts "$TTS" --debug-copy
          python -m kindled_iron.render "${{ inputs.scene }}" --out storage/kindled_iron/test.mp4 \
            --work storage/kindled_iron/work --reuse-audio --safe-box --frames-only 0,1,3,6,10,15,20,25,30,35,40,45,50

      - name: Delete the reference clip
        if: always()
        run: rm -rf "$RUNNER_TEMP/voice_refs"

      - name: Save voice audio + clips cache (even if a later step fails)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ki-cache
          key: ki-media-${{ github.run_id }}

      - name: Check the MP4 with ffprobe
        run: |
          set -euo pipefail
          f=storage/kindled_iron/test.mp4
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate:format=duration,size -of default=noprint_wrappers=1 "$f"
          python - <<'PY'
          import json, subprocess, sys
          f = "storage/kindled_iron/test.mp4"
          info = json.loads(subprocess.check_output(["ffprobe", "-v", "error", "-show_streams", "-show_format", "-of", "json", f]))
          v = [s for s in info["streams"] if s["codec_type"] == "video"]
          a = [s for s in info["streams"] if s["codec_type"] == "audio"]
          dur = float(info["format"]["duration"])
          problems = []
          if not v or (v[0]["width"], v[0]["height"]) != (1080, 1920):
              problems.append("video is not 1080x1920")
          if not a:
              problems.append("no audio stream")
          if not 30.0 <= dur <= 75.0:
              problems.append(f"duration {dur:.1f} s is outside 30-75 s")
          meta = json.load(open("storage/kindled_iron/test_meta.json"))
          print(f"duration {dur:.2f} s, words {meta['words']}, voice {meta['voice'].get('provider_used')}"
                f"{' (FALLBACK VOICE)' if meta['voice'].get('fallback') else ''}, insets {len(meta['insets'])}")
          if problems:
              sys.exit("FAIL: " + "; ".join(problems))
          print("OK")
          PY
          ffmpeg -v error -i "$f" -f null - && echo "decode OK"

      - name: My voice -> private repo (never a public artifact)
        if: ${{ inputs.my_voice && env.HAS_VOICE_REPO == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.VOICE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          [ "$(gh repo view "$VOICE_REPO" --json isPrivate -q .isPrivate)" = "true" ] || { echo "FAIL: $VOICE_REPO is not private"; exit 1; }
          # an empty repo can't hold releases: give it a first commit (a README) once
          gh api "repos/$VOICE_REPO/commits?per_page=1" >/dev/null 2>&1 || \
            gh api -X PUT "repos/$VOICE_REPO/contents/README.md" -f message="Initialize private voice repo" \
              -f content="$(printf '# Kindled Iron voice (private)\n\nReference clips, voice comparisons and test renders. Never publish.\n' | base64 -w0)" >/dev/null
          gh release view test-renders --repo "$VOICE_REPO" >/dev/null 2>&1 || \
            gh release create test-renders --repo "$VOICE_REPO" --title "Kindled Iron test renders" --notes "Private test renders. Not published."
          stamp=$(date -u +%Y%m%d-%H%M)
          name=$(basename "${{ inputs.scene }}" .json)
          cp storage/kindled_iron/test.mp4 "$name-$stamp.mp4"
          cp storage/kindled_iron/test_safebox.mp4 "$name-$stamp-safebox.mp4"
          cp storage/kindled_iron/test_novoice.mp4 "$name-$stamp-novoice.mp4"
          gh release upload test-renders --repo "$VOICE_REPO" --clobber "$name-$stamp.mp4" "$name-$stamp-safebox.mp4" \
            "$name-$stamp-novoice.mp4"
          echo "Uploaded to https://github.com/$VOICE_REPO/releases/tag/test-renders"

      - name: Upload stills, metadata, sources (no voice audio)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kindled-iron-test-info
          path: |
            storage/kindled_iron/test.srt
            storage/kindled_iron/test_meta.json
            storage/kindled_iron/test_sources.json
            storage/kindled_iron/test_sounds.json
            storage/kindled_iron/test_insets.jpg
            storage/kindled_iron/work/stills/**
            storage/kindled_iron/work/checks.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload the videos (Kokoro voice only)
        if: ${{ !inputs.my_voice }}
        uses: actions/upload-artifact@v4
        with:
          name: kindled-iron-test-video
          path: |
            storage/kindled_iron/test.mp4
            storage/kindled_iron/test_safebox.mp4
            storage/kindled_iron/test_novoice.mp4
          retention-days: 14

      - name: my_voice without a private repo
        if: ${{ inputs.my_voice && env.HAS_VOICE_REPO != 'true' }}
        run: |
          echo "::warning::my_voice was ticked but VOICE_REPO_TOKEN is not set, so the video was NOT uploaded anywhere (it holds your cloned voice). Set up the private repo (kindled_iron/README.md) and run again; the voice audio is cached, so the rerun costs 0 credits."
