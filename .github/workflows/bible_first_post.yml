name: Bible First Post

on:
  workflow_dispatch:
    inputs:
      render_video:
        description: "Render upgraded Genesis 1 episode"
        required: true
        default: false
        type: boolean

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        if: ${{ inputs.render_video }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Validate 66-book Bible rules
        run: |
          python scripts/bible_content_engine.py --episode 1

      - name: Build scene based Bible story
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("content/bible/episodes/001_creation_scenes.json").read_text(encoding="utf-8"))
          lines = [s["narration"] for s in data["scenes"]] + [data["cta"]]
          out = Path("storage/bible/episode_001_script.txt")
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text("\n\n".join(lines) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Set up native MoneyPrinterTurbo config
        if: ${{ inputs.render_video }}
        run: |
          set -euo pipefail
          cp config.example.toml config.toml
          echo "Created native MoneyPrinterTurbo config.toml."

      - name: Configure native Pixabay stock footage flow
        if: ${{ inputs.render_video }}
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PIXABAY_API_KEY:-}" ]; then
            echo "PIXABAY_API_KEY is required."
            exit 1
          fi
          cp config.example.toml config.toml
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path("config.toml")
          s = p.read_text(encoding="utf-8")
          s = s.replace('video_source = "pexels"', 'video_source = "pixabay"')
          s = s.replace("pixabay_api_keys = []", 'pixabay_api_keys = ["' + os.environ["PIXABAY_API_KEY"] + '"]')
          p.write_text(s, encoding="utf-8")
          PY
          echo "Configured MoneyPrinterTurbo to use Pixabay stock footage."

      - name: Start local Kokoro TTS
        if: ${{ inputs.render_video }}
        run: |
          set -euo pipefail
          docker pull ghcr.io/remsky/kokoro-fastapi-cpu:v0.8.0
          docker run -d --name kindled-iron-kokoro -p 8880:8880 ghcr.io/remsky/kokoro-fastapi-cpu:v0.8.0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8880/health >/dev/null 2>&1; then
              echo "Kokoro TTS is healthy."
              exit 0
            fi
            sleep 5
          done
          echo "Kokoro TTS failed to become healthy."
          docker logs kindled-iron-kokoro || true
          exit 1

      - name: Configure Kokoro voice and Whisper subtitles
        if: ${{ inputs.render_video }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path("config.toml")
          s = p.read_text(encoding="utf-8")
          s = s.replace('subtitle_provider = "edge"', 'subtitle_provider = "whisper"')
          p.write_text(s, encoding="utf-8")
          PY
          echo "Configured local Kokoro TTS at http://127.0.0.1:8880/v1 with Whisper subtitle timing."
      - name: Build scene matched music bed
        if: ${{ inputs.render_video }}
        run: |
          set -euo pipefail
          mkdir -p storage/bgm storage/bible/audio
          python scripts/kindled_iron_audio.py \
            --scene-file content/bible/episodes/001_creation_scenes.json \
            --duration 120 \
            --music-out storage/bgm/creation_cinematic.wav \
            --sfx-out storage/bible/audio/creation_sfx.wav
          echo "Built local cinematic music bed and scene SFX."

      - name: Render base video with native MoneyPrinterTurbo
        if: ${{ inputs.render_video }}
        run: |
          set -euo pipefail
          uv sync --frozen
          uv run python cli.py \
            --video-subject "Creation: In the Beginning" \
            --video-script "$(cat storage/bible/episode_001_script.txt)" \
            --video-language en-US \
            --video-aspect 9:16 \
            --video-source pixabay \
            --video-terms "primordial earth, dark ocean waters, Spirit over waters, divine light breaking darkness, sky and gathered waters, dry land and vegetation, sun moon stars, sea creatures birds land animals, man and woman" \
            --video-clip-duration 7 \
            --video-concat-mode sequential \
            --match-materials-to-script \
            --voice-name kokoro:am_michael \
            --voice-rate 1.0 \
            --video-fit-mode cover \
            --video-transition-mode fade-in \
            --bgm-type custom \
            --bgm-file storage/bgm/creation_cinematic.wav \
            --bgm-volume 0.16 \
            --subtitle-enabled \
            --subtitle-display-mode word_by_word \
            --subtitle-animation pop_spring \
            --subtitle-position two_thirds_bottom \
            --text-fore-color "#FFFFFF" \
            --stroke-color "#1A0D05" \
            --stroke-width 3 \
            --font-size 64 \
            --stop-at video

      - name: Add scene SFX and Kindled Iron cinematic polish
        if: ${{ inputs.render_video }}
        run: |
          set -euo pipefail
          BASE="$(find storage/tasks -type f -name '*.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          if [ -z "$BASE" ] || [ ! -f "$BASE" ]; then
            echo "MoneyPrinterTurbo did not produce an MP4."
            exit 1
          fi
          DURATION="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$BASE")"
          python scripts/kindled_iron_audio.py \
            --scene-file content/bible/episodes/001_creation_scenes.json \
            --duration "$DURATION" \
            --music-out storage/bible/audio/creation_cinematic_final.wav \
            --sfx-out storage/bible/audio/creation_sfx_final.wav
          ffmpeg -y -i "$BASE" -i storage/bible/audio/creation_sfx_final.wav \
            -filter_complex "[1:a]volume=0.65[sfx];[0:a][sfx]amix=inputs=2:duration=first:dropout_transition=2[mix]" \
            -map 0:v:0 -map "[mix]" \
            -vf "colorbalance=rs=0.02:gs=0.008:bs=-0.012:rm=0.018:gm=0.004:bm=-0.01:rh=0.025:gh=0.006:bh=-0.015,eq=contrast=1.035:saturation=1.03,drawbox=x=0:y=0:w=iw:h=116:color=black@0.30:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='KINDLED IRON':fontcolor=white@0.92:fontsize=40:x=(w-text_w)/2:y=30" \
            -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -c:a aac -b:a 192k \
            storage/bible/kindled-iron-episode-001.mp4

      - name: Stop local Kokoro TTS
        if: ${{ always() && inputs.render_video }}
        run: |
          docker logs kindled-iron-kokoro || true
          docker rm -f kindled-iron-kokoro || true
      - name: Upload first episode artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kindled-iron-bible-episode-001
          path: |
            storage/bible/episode_001.json
            storage/bible/episode_001_script.txt
            storage/bible/episode_001/**
            storage/bible/kindled-iron-episode-001.mp4
            storage/tasks/**
          if-no-files-found: warn
