name: TikTok OAuth Connect

on:
  workflow_dispatch:
    inputs:
      callback_url:
        description: "Paste the full TikTok callback URL from the Night Files callback page"
        required: true
        type: string

jobs:
  connect:
    runs-on: ubuntu-latest

    steps:
      - name: Exchange TikTok authorization code
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          GH_SECRETS_TOKEN: ${{ secrets.GH_SECRETS_WRITE_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${CLIENT_KEY}" ] || [ -z "${CLIENT_SECRET}" ]; then
            echo "::error::Missing TIKTOK_CLIENT_KEY or TIKTOK_CLIENT_SECRET."
            exit 1
          fi

          if [ -z "${GH_SECRETS_TOKEN}" ]; then
            echo "::error::Missing GH_SECRETS_WRITE_TOKEN."
            echo "Create a fine-grained GitHub token with repository Secrets: Read and write, then save it as GH_SECRETS_WRITE_TOKEN."
            exit 1
          fi

          echo "::add-mask::${CALLBACK_URL}"
          echo "::add-mask::${GH_SECRETS_TOKEN}"

          export CALLBACK_URL CLIENT_KEY CLIENT_SECRET

          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error

          redirect_uri = "https://venloud.github.io/nightfiles/tiktok-callback.html"
          callback = os.environ["CALLBACK_URL"]

          parsed = urllib.parse.urlparse(callback)
          base = f"{parsed.scheme}://{parsed.netloc}{parsed.path}"
          if base != redirect_uri:
              raise SystemExit("Callback URL does not match the registered TikTok redirect URI.")

          params = urllib.parse.parse_qs(parsed.query)

          error = params.get("error", [None])[0]
          if error:
              desc = params.get("error_description", [""])[0]
              raise SystemExit(f"TikTok authorization failed: {error}: {desc}")

          code = params.get("code", [None])[0]
          state = params.get("state", [None])[0]

          if not code:
              raise SystemExit("Callback URL does not contain an authorization code.")

          if state != "nightfiles":
              raise SystemExit("Unexpected OAuth state. Expected 'nightfiles'.")

          payload = urllib.parse.urlencode({
              "client_key": os.environ["CLIENT_KEY"],
              "client_secret": os.environ["CLIENT_SECRET"],
              "code": code,
              "grant_type": "authorization_code",
              "redirect_uri": redirect_uri,
          }).encode()

          request = urllib.request.Request(
              "https://open.tiktokapis.com/v2/oauth/token/",
              data=payload,
              headers={"Content-Type": "application/x-www-form-urlencoded"},
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  data = json.loads(response.read().decode())
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode(errors="replace")
              raise SystemExit(f"TikTok token exchange failed: {detail}")

          if data.get("error"):
              raise SystemExit(json.dumps(data))

          required = ("access_token", "refresh_token", "open_id")
          missing = [key for key in required if not data.get(key)]
          if missing:
              raise SystemExit("TikTok response is missing: " + ", ".join(missing))

          for key in required:
              print(f"::add-mask::{data[key]}")

          with open("/tmp/tiktok_tokens.json", "w") as f:
              json.dump(data, f)

          print("TikTok OAuth exchange succeeded.")
          print(f"open_id: {data['open_id']}")
          print(f"scope: {data.get('scope', '')}")
          print(f"access token expires in: {data.get('expires_in')} seconds")
          print(f"refresh token expires in: {data.get('refresh_expires_in')} seconds")
          PY

      - name: Save TikTok tokens to GitHub Actions Secrets
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_WRITE_TOKEN }}
        run: |
          set -euo pipefail

          ACCESS_TOKEN="$(python3 -c 'import json; print(json.load(open("/tmp/tiktok_tokens.json"))["access_token"])')"
          REFRESH_TOKEN="$(python3 -c 'import json; print(json.load(open("/tmp/tiktok_tokens.json"))["refresh_token"])')"
          OPEN_ID="$(python3 -c 'import json; print(json.load(open("/tmp/tiktok_tokens.json"))["open_id"])')"

          echo "::add-mask::${ACCESS_TOKEN}"
          echo "::add-mask::${REFRESH_TOKEN}"
          echo "::add-mask::${OPEN_ID}"

          gh secret set TIKTOK_ACCESS_TOKEN --repo "${GITHUB_REPOSITORY}" --body "${ACCESS_TOKEN}"
          gh secret set TIKTOK_REFRESH_TOKEN --repo "${GITHUB_REPOSITORY}" --body "${REFRESH_TOKEN}"
          gh secret set TIKTOK_OPEN_ID --repo "${GITHUB_REPOSITORY}" --body "${OPEN_ID}"

          rm -f /tmp/tiktok_tokens.json

          echo "Saved TIKTOK_ACCESS_TOKEN, TIKTOK_REFRESH_TOKEN, and TIKTOK_OPEN_ID to GitHub Actions Secrets."
